name: Build Windows installer, Linux AppImage and macOS disk image

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Push-Location build/windows
          qmake ../../sj-sim.pro CONFIG+=release
          nmake
          Pop-Location
      - name: Create installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build/windows
      - name: Test installation, Qt startup, upgrade and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/SjSim-*-windows-x64-Setup.exe | Select-Object -First 1
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: |
            dist/SjSim-*-windows-x64-Setup.exe
            dist/SjSim-*-windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libgl1-mesa-dev libfuse2 libxcb-cursor0 libxkbcommon-x11-0 xauth xvfb
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: linux_gcc_64
          modules: qtcharts
          cache: true
      - name: Build
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake ../../sj-sim.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Create AppImage
        run: bash scripts/package-linux.sh build/linux
      - name: Test the actual AppImage with a fresh data directory
        run: |
          artifact=$(find dist -maxdepth 1 -name 'SjSim-*-linux-x86_64.AppImage' -print -quit)
          env -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH -u QT_PLUGIN_PATH \
            APPIMAGE_EXTRACT_AND_RUN=1 QT_QUICK_BACKEND=software \
            xvfb-run -a timeout 45s "$artifact" --deployment-smoke
          cd dist
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: |
            dist/SjSim-*-linux-x86_64.AppImage
            dist/SjSim-*-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    # Experimental: built and smoke-started in CI, not yet tested by players on real Macs.
    # The newest GitHub macOS image; older pinned images are retired over time.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: mac
          target: desktop
          arch: clang_64
          modules: qtcharts
          cache: true
      - name: Remove the AGL framework from the Qt build settings
        # Qt 6.8.3 refers to AGL, which recent macOS SDKs no longer ship.
        run: |
          files=$(grep -rlE -- "-framework,?AGL|-framework AGL" "$QT_ROOT_DIR/mkspecs" "$QT_ROOT_DIR/lib" --include="*.conf" --include="*.prl" --include="*.pri" || true)
          for file in $files; do sed -i '' -e 's/-framework AGL//g' -e 's/-framework,AGL//g' "$file"; echo "patched $file"; done
      - name: Build universal app
        run: |
          mkdir -p build/macos
          cd build/macos
          qmake ../../sj-sim.pro CONFIG+=release
          # Compiler errors are repeated as annotations so they are readable without the raw log.
          set +e
          make -j"$(sysctl -n hw.ncpu)" -k 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            grep -E "error:|Error [0-9]|ld: " build.log | sort -u | head -40 | while IFS= read -r line; do echo "::error::${line//%/%25}"; done
            exit "$status"
          fi
      - name: Create signed disk image
        run: bash scripts/package-macos.sh build/macos
      - name: Check both architectures and the checksum
        run: |
          artifact=$(find dist -maxdepth 1 -name 'SjSim-*-macos-universal.dmg' -print -quit)
          mount_point=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "$artifact"
          lipo -info "$mount_point/Sj.Sim.app/Contents/MacOS/sj-sim" | grep -q arm64
          lipo -info "$mount_point/Sj.Sim.app/Contents/MacOS/sj-sim" | grep -q x86_64
          hdiutil detach "$mount_point"
          cd dist
          shasum -a 256 -c ./*.dmg.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: macos-release
          path: |
            dist/SjSim-*-macos-universal.dmg
            dist/SjSim-*-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    # The experimental macOS build is attached when it succeeds but never blocks a release.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.linux.result == 'success'
    permissions:
      contents: write
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Find release notes for the tag
        id: notes
        run: |
          notes="docs/releases/${GITHUB_REF_NAME#v}.md"
          test -f "$notes" || { echo "Missing $notes" >&2; exit 1; }
          echo "path=$notes" >> "$GITHUB_OUTPUT"
      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Sj.Sim ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: release-assets/*
          fail_on_unmatched_files: true
