name: Build and publish release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Push-Location build/windows
          qmake ../..\sj-sim.pro CONFIG+=release
          nmake
          Pop-Location
      - name: Package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -BuildDir build/windows -OutputDir dist/sj-sim-windows-x64
          $env:QT_QPA_PLATFORM = "offscreen"
          $process = Start-Process -FilePath "$PWD/dist/sj-sim-windows-x64/sj-sim.exe" -WorkingDirectory "$PWD/dist/sj-sim-windows-x64" -PassThru
          if ($process.WaitForExit(5000)) { throw "Packaged application exited unexpectedly with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
          Compress-Archive -Path dist/sj-sim-windows-x64 -DestinationPath dist/sj-sim-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: dist/sj-sim-windows-x64.zip
          if-no-files-found: error

  linux:
    # Build in an older userspace so the release works on a broad range of
    # current x86-64 distributions instead of targeting the developer's OS.
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      - name: Install container prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates curl git imagemagick libgl1-mesa-dev libfuse2 libqt5charts5-dev libqt5svg5-dev libxcb-cursor0 libxkbcommon-x11-0 qtbase5-dev qttools5-dev-tools xauth xvfb
      - uses: actions/checkout@v6
      - name: Build
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake ../../sj-sim.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Package portable application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QMAKE: /usr/bin/qmake
        run: |
          curl -L -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          bash scripts/package-linux.sh build/linux dist/sj-sim-linux-x64
      - name: Smoke-test packaged launcher
        run: |
          set +e
          xvfb-run -a timeout 5s ./dist/sj-sim-linux-x64/Sj.Sim
          status=$?
          set -e
          test "$status" -eq 124
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: dist/sj-sim-linux-x64.tar.gz
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish commit release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: continuous-${{ github.sha }}
          target_commitish: ${{ github.sha }}
          name: Continuous build ${{ github.sha }}
          body: Automated Windows and Linux build for commit ${{ github.sha }}.
          prerelease: true
          make_latest: true
          files: release-assets/*
          fail_on_unmatched_files: true
