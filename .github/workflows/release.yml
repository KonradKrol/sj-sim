name: Build portable Windows and Linux packages

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Push-Location build/windows
          qmake ../..\sj-sim.pro CONFIG+=release
          nmake
          Pop-Location
      - name: Package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -BuildDir build/windows -OutputDir dist/sj-sim-windows-x64
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QT_QUICK_BACKEND = "software"
          $env:QT_FORCE_STDERR_LOGGING = "1"
          $process = [System.Diagnostics.Process]::new()
          $process.StartInfo.FileName = "$PWD/dist/sj-sim-windows-x64/sj-sim.exe"
          $process.StartInfo.Arguments = '--deployment-smoke'
          $process.StartInfo.WorkingDirectory = "$PWD/dist/sj-sim-windows-x64"
          $process.StartInfo.UseShellExecute = $false
          [void]$process.Start()
          if (-not $process.WaitForExit(30000)) { Stop-Process -Id $process.Id -Force; throw "Packaged UI did not become ready" }
          if ($process.ExitCode -ne 0) { throw "Packaged UI failed: $($process.ExitCode)" }
          Remove-Item -LiteralPath dist/sj-sim-windows-x64/deployment-smoke.log -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/sj-sim-windows-x64 -DestinationPath dist/sj-sim-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: dist/sj-sim-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux packaging tools
        run: sudo apt-get update && sudo apt-get install -y build-essential imagemagick libgl1-mesa-dev libfuse2 libxcb-cursor0 libxkbcommon-x11-0 xauth xvfb
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: linux_gcc_64
          modules: qtcharts
          cache: true
      - name: Build
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake ../../sj-sim.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Package portable application
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/source/UI/Quick
          EXTRA_PLATFORM_PLUGINS: libqoffscreen.so
          QT_QUICK_BACKEND: software
        run: |
          curl --fail --location --retry 3 -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl --fail --location --retry 3 -o linuxdeploy-plugin-qt-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage
          bash scripts/package-linux.sh build/linux dist/sj-sim-linux-x64
      - name: Smoke-test packaged launcher
        run: |
          QT_QUICK_BACKEND=software xvfb-run -a timeout 30s ./dist/sj-sim-linux-x64/Sj.Sim --deployment-smoke
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: dist/sj-sim-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Sj.Sim ${{ github.ref_name }}
          body: Automated Windows and Linux build for commit ${{ github.sha }}.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
