name: Build Windows installer and Linux AppImage

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtcharts
          cache: true
      - name: Install installer compiler
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows | Out-Null
          Push-Location build/windows
          qmake ../../sj-sim.pro CONFIG+=release
          nmake
          Pop-Location
      - name: Create installer
        shell: pwsh
        run: ./scripts/package-windows.ps1 -BuildDir build/windows
      - name: Test installation, Qt startup, upgrade and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/SjSim-*-windows-x64-Setup.exe | Select-Object -First 1
          ./scripts/test-windows-installer.ps1 -Installer $installer.FullName
      - uses: actions/upload-artifact@v6
        with:
          name: windows-release
          path: |
            dist/SjSim-*-windows-x64-Setup.exe
            dist/SjSim-*-windows-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 14

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 libgl1-mesa-dev libfuse2 libxcb-cursor0 libxkbcommon-x11-0 xauth xvfb
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: linux_gcc_64
          modules: qtcharts
          cache: true
      - name: Build
        run: |
          mkdir -p build/linux
          cd build/linux
          qmake ../../sj-sim.pro CONFIG+=release
          make -j"$(nproc)"
      - name: Create AppImage
        run: bash scripts/package-linux.sh build/linux
      - name: Test the actual AppImage with a fresh data directory
        run: |
          artifact=$(find dist -maxdepth 1 -name 'SjSim-*-linux-x86_64.AppImage' -print -quit)
          env -u LD_LIBRARY_PATH -u QML2_IMPORT_PATH -u QML_IMPORT_PATH -u QT_PLUGIN_PATH \
            APPIMAGE_EXTRACT_AND_RUN=1 QT_QUICK_BACKEND=software \
            xvfb-run -a timeout 45s "$artifact" --deployment-smoke
          cd dist
          sha256sum -c ./*.sha256
      - uses: actions/upload-artifact@v6
        with:
          name: linux-release
          path: |
            dist/SjSim-*-linux-x86_64.AppImage
            dist/SjSim-*-linux-x86_64.AppImage.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tagged release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Sj.Sim ${{ github.ref_name }}
          body: Windows — pobierz Setup.exe i zainstaluj. Linux — pobierz AppImage i nadaj prawo uruchamiania. Paczki i zapisy pozostają w Dokumenty/SjSimData.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true
